<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=Noto+Sans+KR:wght@400;500;700&amp;display=swap">
  <style>
    body { margin: 0; }
    a { color: #2DD4A8; } a:hover { color: #5EEAD4; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #0B0F14; color: #E6EDF3; font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif; display: flex; flex-direction: column; box-sizing: border-box; overflow: hidden;">

  <div style="display: flex; justify-content: space-between; align-items: center; padding: 24px 20px 0 20px;">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#7D8794" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg>
    <span style="font-size: 13px; font-weight: 700;">Day 1</span>
    <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #7D8794;">07/50</span>
  </div>

  <div style="margin: 14px 20px 0 20px; height: 3px; border-radius: 2px; background: #1C2530;">
    <div style="width: 14%; height: 3px; border-radius: 2px; background: #2DD4A8;"></div>
  </div>

  <div style="display: flex; gap: 6px; padding: 16px 20px 0 20px;">
    <span style="background: rgba(45, 212, 168, 0.12); color: #2DD4A8; border: 1px solid rgba(45, 212, 168, 0.4); border-radius: 8px; padding: 6px 12px; font-size: 12px; font-weight: 700;">학습</span>
    <span style="border: 1px solid #232D38; color: #7D8794; border-radius: 8px; padding: 6px 12px; font-size: 12px;">셀프</span>
    <span style="border: 1px solid #232D38; color: #7D8794; border-radius: 8px; padding: 6px 12px; font-size: 12px;">오답 노트</span>
    <span style="border: 1px solid #232D38; color: #7D8794; border-radius: 8px; padding: 6px 12px; font-size: 12px;">듣기</span>
  </div>

  <div style="flex-grow: 1; display: flex; flex-direction: column; padding: 26px 20px 0 20px;">
    <div style="background: #11171F; border: 1px solid #232D38; border-radius: 20px; padding: 30px 20px 22px 20px; display: flex; flex-direction: column; gap: 18px;">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 7px;">
        <div style="font-size: 50px; font-weight: 700; line-height: 1; letter-spacing: 0.01em;">about</div>
        <div style="display: flex; align-items: center; gap: 9px;">
          <span style="font-family: 'IBM Plex Mono', monospace; font-size: 14px; color: #7D8794;">/əˈbaʊt/</span>
          <div style="width: 30px; height: 30px; border: 1px solid rgba(45, 212, 168, 0.5); border-radius: 999px; display: flex; align-items: center; justify-content: center;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#2DD4A8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"></path><path d="M16.5 8.5a5 5 0 0 1 0 7"></path></svg>
          </div>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 9px; border-top: 1px solid #1C2530; padding-top: 16px;">
        <div style="display: flex; align-items: baseline; gap: 10px;">
          <span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.14em; color: #A78BFA; width: 42px;">PREP</span>
          <span style="font-size: 16px; font-weight: 500;">~에 대해, 약</span>
        </div>
        <div style="display: flex; align-items: baseline; gap: 10px;">
          <span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.14em; color: #A78BFA; width: 42px;">ADV</span>
          <span style="font-size: 16px; font-weight: 500;">대략</span>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px;">
        <div style="background: #0E1319; border: 1px solid #1C2530; border-radius: 12px; padding: 11px 13px; display: flex; flex-direction: column; gap: 3px;">
          <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 8px;">
            <span style="font-size: 14px; line-height: 1.5;">There&#39;s nothing to get angry <span style="color: #2DD4A8; font-weight: 700;">about</span>.</span>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#58656F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 3px;"><path d="M4 9v6h4l5 4V5L8 9H4z"></path><path d="M16.5 8.5a5 5 0 0 1 0 7"></path></svg>
          </div>
          <span style="font-size: 12px; color: #7D8794;">화낼 일이 전혀 없다.</span>
        </div>
        <div style="background: #0E1319; border: 1px solid #1C2530; border-radius: 12px; padding: 11px 13px; display: flex; flex-direction: column; gap: 3px;">
          <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 8px;">
            <span style="font-size: 14px; line-height: 1.5;">Tell me <span style="color: #2DD4A8; font-weight: 700;">about</span> your day.</span>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#58656F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 3px;"><path d="M4 9v6h4l5 4V5L8 9H4z"></path><path d="M16.5 8.5a5 5 0 0 1 0 7"></path></svg>
          </div>
          <span style="font-size: 12px; color: #7D8794;">네 하루에 대해 말해줘.</span>
        </div>
      </div>
    </div>
  </div>

  <div style="display: flex; gap: 8px; padding: 14px 20px 28px 20px;">
    <button style="flex: 1; height: 54px; background: rgba(248, 113, 113, 0.1); color: #F87171; border: 1px solid rgba(248, 113, 113, 0.45); border-radius: 12px; font-family: 'Noto Sans KR', sans-serif; font-size: 15px; font-weight: 700; cursor: pointer;">모름</button>
    <button style="flex: 1; height: 54px; background: rgba(251, 191, 36, 0.1); color: #FBBF24; border: 1px solid rgba(251, 191, 36, 0.45); border-radius: 12px; font-family: 'Noto Sans KR', sans-serif; font-size: 15px; font-weight: 700; cursor: pointer;">헷갈림</button>
    <button style="flex: 1; height: 54px; background: rgba(45, 212, 168, 0.12); color: #2DD4A8; border: 1px solid rgba(45, 212, 168, 0.55); border-radius: 12px; font-family: 'Noto Sans KR', sans-serif; font-size: 15px; font-weight: 700; cursor: pointer;">앎</button>
  </div>
</div>
</x-dc>
</body>
</html>
