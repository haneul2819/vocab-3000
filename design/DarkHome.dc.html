<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=Noto+Sans+KR:wght@400;500;700&amp;display=swap">
  <style>
    body { margin: 0; }
    a { color: #2DD4A8; } a:hover { color: #5EEAD4; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #0B0F14; color: #E6EDF3; font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif; display: flex; flex-direction: column; box-sizing: border-box; overflow: hidden;">

  <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 14px; padding: 28px 20px 0 20px; box-sizing: border-box;">

    <div style="display: flex; justify-content: space-between; align-items: center;">
      <div style="display: flex; flex-direction: column; gap: 2px;">
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.22em; color: #2DD4A8;">VOCAB 3000</span>
        <span style="font-size: 21px; font-weight: 700;">오늘의 학습</span>
      </div>
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#7D8794" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.2 2.2M16.9 16.9l2.2 2.2M19.1 4.9l-2.2 2.2M7.1 16.9l-2.2 2.2"></path></svg>
    </div>

    <div style="background: #11171F; border: 1px solid #232D38; border-radius: 18px; padding: 20px 18px; display: flex; align-items: center; gap: 18px;">
      <div style="position: relative; width: 84px; height: 84px; flex-shrink: 0;">
        <svg width="84" height="84" viewBox="0 0 84 84" style="transform: rotate(-90deg);">
          <circle cx="42" cy="42" r="37" fill="none" stroke="#1C2530" stroke-width="6"></circle>
          <circle cx="42" cy="42" r="37" fill="none" stroke="#2DD4A8" stroke-width="6" stroke-linecap="round" stroke-dasharray="232.5" stroke-dashoffset="204.6"></circle>
        </svg>
        <div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 500; color: #2DD4A8;">12%</div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px; flex-grow: 1;">
        <div style="display: flex; align-items: center; gap: 8px;">
          <span style="font-size: 19px; font-weight: 700;">Day 1</span>
          <span style="background: rgba(45, 212, 168, 0.12); color: #2DD4A8; border-radius: 6px; padding: 2px 8px; font-size: 11px; font-weight: 500;">초등</span>
        </div>
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #7D8794;">6 / 50 words</span>
        <button style="height: 42px; background: #2DD4A8; color: #06231B; border: none; border-radius: 10px; font-family: 'Noto Sans KR', sans-serif; font-size: 14px; font-weight: 700; cursor: pointer;">학습 시작</button>
      </div>
    </div>

    <div style="display: flex; gap: 10px;">
      <div style="flex: 1; background: #11171F; border: 1px solid #232D38; border-radius: 14px; padding: 13px 14px; display: flex; flex-direction: column; gap: 3px;">
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 20px; font-weight: 500; color: #A78BFA;">4</span>
        <span style="font-size: 11.5px; color: #7D8794;">오늘 복습 대기</span>
      </div>
      <div style="flex: 1; background: #11171F; border: 1px solid #232D38; border-radius: 14px; padding: 13px 14px; display: flex; flex-direction: column; gap: 3px;">
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 20px; font-weight: 500; color: #2DD4A8;">3</span>
        <span style="font-size: 11.5px; color: #7D8794;">연속 학습일</span>
      </div>
      <div style="flex: 1; background: #11171F; border: 1px solid #232D38; border-radius: 14px; padding: 13px 14px; display: flex; flex-direction: column; gap: 3px;">
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 20px; font-weight: 500; color: #E6EDF3;">92<span style="font-size: 12px;">%</span></span>
        <span style="font-size: 11.5px; color: #7D8794;">최근 정답률</span>
      </div>
    </div>

    <div style="background: #11171F; border: 1px solid #232D38; border-radius: 14px; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center;">
      <div style="display: flex; flex-direction: column; gap: 2px;">
        <span style="font-size: 14px; font-weight: 700;">진단 테스트</span>
        <span style="font-size: 12px; color: #7D8794;">30문항 · 시작 Day 추천</span>
      </div>
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#2DD4A8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px;">
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.22em; color: #7D8794;">TRACKS</span>

      <div style="background: #11171F; border: 1px solid #2DD4A8; border-radius: 14px; padding: 13px 16px; display: flex; align-items: center; gap: 14px;">
        <div style="display: flex; flex-direction: column; gap: 5px; flex-grow: 1;">
          <div style="display: flex; justify-content: space-between; font-size: 13.5px;">
            <span style="font-weight: 700;">초등</span>
            <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #7D8794;">D1–16 · 800</span>
          </div>
          <div style="height: 4px; border-radius: 2px; background: #1C2530;"><div style="width: 8%; height: 4px; border-radius: 2px; background: #2DD4A8;"></div></div>
        </div>
      </div>
      <div style="background: #11171F; border: 1px solid #232D38; border-radius: 14px; padding: 13px 16px; display: flex; align-items: center; gap: 14px;">
        <div style="display: flex; flex-direction: column; gap: 5px; flex-grow: 1;">
          <div style="display: flex; justify-content: space-between; font-size: 13.5px;">
            <span style="font-weight: 700; color: #B9C4CF;">중·고 공통</span>
            <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #7D8794;">D17–40 · 1200</span>
          </div>
          <div style="height: 4px; border-radius: 2px; background: #1C2530;"></div>
        </div>
      </div>
      <div style="background: #11171F; border: 1px solid #232D38; border-radius: 14px; padding: 13px 16px; display: flex; align-items: center; gap: 14px;">
        <div style="display: flex; flex-direction: column; gap: 5px; flex-grow: 1;">
          <div style="display: flex; justify-content: space-between; font-size: 13.5px;">
            <span style="font-weight: 700; color: #B9C4CF;">심화</span>
            <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #7D8794;">D41–60 · 1000</span>
          </div>
          <div style="height: 4px; border-radius: 2px; background: #1C2530;"></div>
        </div>
      </div>
    </div>
  </div>

  <div style="display: flex; background: #0E1319; border-top: 1px solid #232D38; padding: 10px 8px 24px 8px;">
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; color: #2DD4A8;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"></path><path d="M5 9.5V21h14V9.5"></path></svg>
      <span style="font-size: 10px; font-weight: 700;">홈</span>
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; color: #58656F;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l4-1L20.5 6.5a2.1 2.1 0 0 0-3-3L5 16l-1 4z"></path></svg>
      <span style="font-size: 10px;">문제집</span>
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; color: #58656F;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 5c3-1.4 6-1.4 9 0v14c-3-1.4-6-1.4-9 0z"></path><path d="M22 5c-3-1.4-6-1.4-9 0v14c3-1.4 6-1.4 9 0z"></path></svg>
      <span style="font-size: 10px;">문법</span>
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; color: #58656F;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.4"></path><path d="M21 3v6h-6"></path></svg>
      <span style="font-size: 10px;">복습</span>
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; color: #58656F;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20v-8M10 20V5M16 20v-5M21 20H3"></path></svg>
      <span style="font-size: 10px;">통계</span>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
