<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@500;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;500;600&amp;display=swap">
  <style>
    body { margin: 0; }
    a { color: #B45309; } a:hover { color: #92400E; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #FAF7F2; color: #201D1A; font-family: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif; display: flex; flex-direction: column; box-sizing: border-box; overflow: hidden;">

  <div style="display: flex; flex-direction: column; gap: 0; flex-grow: 1; padding: 30px 24px 0 24px; box-sizing: border-box;">

    <div style="display: flex; justify-content: space-between; align-items: flex-end;">
      <div style="display: flex; flex-direction: column; gap: 4px;">
        <div style="font-size: 11px; letter-spacing: 0.18em; color: #8A8378;">교육부 기본 어휘</div>
        <div style="font-family: 'Hahmlet', serif; font-size: 30px; font-weight: 700; line-height: 1.1;">어휘 3000</div>
      </div>
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#8A8378" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.2 2.2M16.9 16.9l2.2 2.2M19.1 4.9l-2.2 2.2M7.1 16.9l-2.2 2.2"></path></svg>
    </div>

    <div style="margin-top: 26px; border-top: 1px solid #201D1A; padding-top: 18px; display: flex; flex-direction: column; gap: 14px;">
      <div style="display: flex; justify-content: space-between; align-items: baseline;">
        <div style="font-family: 'Hahmlet', serif; font-size: 46px; font-weight: 600; line-height: 1;">Day 1</div>
        <div style="font-size: 13px; color: #8A8378;">초등 트랙 · <span style="color: #B45309; font-weight: 600;">6/50</span> 단어</div>
      </div>
      <div style="height: 2px; background: #E7E1D8;"><div style="width: 12%; height: 2px; background: #B45309;"></div></div>
      <button style="display: flex; justify-content: center; align-items: center; height: 52px; background: #201D1A; color: #FAF7F2; border: none; font-family: 'IBM Plex Sans KR', sans-serif; font-size: 15px; font-weight: 600; letter-spacing: 0.04em; cursor: pointer;">오늘 학습 시작</button>
      <div style="display: flex; justify-content: space-between; align-items: center; font-size: 13px;">
        <span style="color: #8A8378;">오늘 복습 대기</span>
        <span style="color: #B45309; font-weight: 600; border-bottom: 1px solid #B45309; padding-bottom: 1px;">4개 복습하기</span>
      </div>
    </div>

    <div style="margin-top: 22px; border-top: 1px solid #E7E1D8; border-bottom: 1px solid #E7E1D8; padding: 14px 0; display: flex; justify-content: space-between; align-items: center;">
      <div style="display: flex; flex-direction: column; gap: 2px;">
        <span style="font-size: 14px; font-weight: 600;">진단 테스트</span>
        <span style="font-size: 12px; color: #8A8378;">30문항으로 시작점 찾기</span>
      </div>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#201D1A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
    </div>

    <div style="margin-top: 24px; display: flex; flex-direction: column; gap: 0;">
      <div style="font-size: 11px; letter-spacing: 0.18em; color: #8A8378; margin-bottom: 10px;">트랙</div>

      <div style="display: flex; align-items: center; gap: 16px; padding: 14px 0; border-top: 1px solid #E7E1D8;">
        <div style="font-family: 'Hahmlet', serif; font-size: 22px; font-weight: 600; color: #B45309; width: 34px;">01</div>
        <div style="display: flex; flex-direction: column; gap: 6px; flex-grow: 1;">
          <div style="display: flex; justify-content: space-between; font-size: 14px;">
            <span style="font-weight: 600;">초등</span>
            <span style="color: #8A8378; font-size: 12px;">Day 1–16 · 800단어</span>
          </div>
          <div style="height: 2px; background: #EFEAE1;"><div style="width: 8%; height: 2px; background: #201D1A;"></div></div>
        </div>
      </div>

      <div style="display: flex; align-items: center; gap: 16px; padding: 14px 0; border-top: 1px solid #E7E1D8;">
        <div style="font-family: 'Hahmlet', serif; font-size: 22px; font-weight: 600; color: #C9C2B6; width: 34px;">02</div>
        <div style="display: flex; flex-direction: column; gap: 6px; flex-grow: 1;">
          <div style="display: flex; justify-content: space-between; font-size: 14px;">
            <span style="font-weight: 600;">중·고 공통</span>
            <span style="color: #8A8378; font-size: 12px;">Day 17–40 · 1,200단어</span>
          </div>
          <div style="height: 2px; background: #EFEAE1;"></div>
        </div>
      </div>

      <div style="display: flex; align-items: center; gap: 16px; padding: 14px 0; border-top: 1px solid #E7E1D8;">
        <div style="font-family: 'Hahmlet', serif; font-size: 22px; font-weight: 600; color: #C9C2B6; width: 34px;">03</div>
        <div style="display: flex; flex-direction: column; gap: 6px; flex-grow: 1;">
          <div style="display: flex; justify-content: space-between; font-size: 14px;">
            <span style="font-weight: 600;">심화</span>
            <span style="color: #8A8378; font-size: 12px;">Day 41–60 · 1,000단어</span>
          </div>
          <div style="height: 2px; background: #EFEAE1;"></div>
        </div>
      </div>
    </div>

    <div style="margin-top: auto; padding-bottom: 14px; font-size: 10px; color: #B4AC9F; line-height: 1.5;">단어 목록: 교육부 고시 제2022-33호 영어과 교육과정 기본 어휘</div>
  </div>

  <div style="display: flex; border-top: 1px solid #E7E1D8; background: #FAF7F2; padding: 10px 8px 22px 8px;">
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; color: #B45309;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"></path><path d="M5 9.5V21h14V9.5"></path></svg>
      <span style="font-size: 10px; font-weight: 600;">홈</span>
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; color: #8A8378;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l4-1L20.5 6.5a2.1 2.1 0 0 0-3-3L5 16l-1 4z"></path></svg>
      <span style="font-size: 10px;">문제집</span>
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; color: #8A8378;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2 5c3-1.4 6-1.4 9 0v14c-3-1.4-6-1.4-9 0z"></path><path d="M22 5c-3-1.4-6-1.4-9 0v14c3-1.4 6-1.4 9 0z"></path></svg>
      <span style="font-size: 10px;">문법</span>
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; color: #8A8378;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.4"></path><path d="M21 3v6h-6"></path></svg>
      <span style="font-size: 10px;">복습</span>
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; color: #8A8378;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20v-8M10 20V5M16 20v-5M21 20H3"></path></svg>
      <span style="font-size: 10px;">통계</span>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
