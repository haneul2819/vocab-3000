<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@500;600;700&amp;family=IBM+Plex+Mono:wght@400&amp;family=IBM+Plex+Sans+KR:wght@400;500;600&amp;display=swap">
  <style>
    body { margin: 0; }
    a { color: #B45309; } a:hover { color: #92400E; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #FAF7F2; color: #201D1A; font-family: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif; display: flex; flex-direction: column; box-sizing: border-box; overflow: hidden;">

  <div style="display: flex; justify-content: space-between; align-items: center; padding: 26px 24px 0 24px;">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#201D1A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg>
    <span style="font-size: 13px; font-weight: 600; letter-spacing: 0.06em;">DAY 1</span>
    <span style="font-family: 'Hahmlet', serif; font-size: 14px; color: #8A8378;">7 / 50</span>
  </div>

  <div style="display: flex; gap: 22px; padding: 22px 24px 0 24px; border-bottom: 1px solid #E7E1D8;">
    <span style="font-size: 13px; font-weight: 600; padding-bottom: 10px; border-bottom: 2px solid #201D1A;">학습</span>
    <span style="font-size: 13px; color: #8A8378; padding-bottom: 10px;">셀프 테스트</span>
    <span style="font-size: 13px; color: #8A8378; padding-bottom: 10px;">오답 노트</span>
    <span style="font-size: 13px; color: #8A8378; padding-bottom: 10px;">듣기</span>
  </div>

  <div style="flex-grow: 1; display: flex; flex-direction: column; padding: 40px 24px 0 24px;">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
      <div style="font-family: 'Hahmlet', serif; font-size: 58px; font-weight: 600; line-height: 1;">about</div>
      <div style="display: flex; align-items: center; gap: 8px;">
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 15px; color: #8A8378;">/əˈbaʊt/</span>
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#B45309" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"></path><path d="M16.5 8.5a5 5 0 0 1 0 7"></path></svg>
      </div>
    </div>

    <div style="margin-top: 34px; border-top: 1px solid #201D1A; padding-top: 18px; display: flex; flex-direction: column; gap: 12px;">
      <div style="display: flex; align-items: baseline; gap: 12px;">
        <span style="font-size: 11px; letter-spacing: 0.16em; color: #B45309; width: 44px;">전치사</span>
        <span style="font-size: 17px; font-weight: 500;">~에 대해, 약</span>
      </div>
      <div style="display: flex; align-items: baseline; gap: 12px;">
        <span style="font-size: 11px; letter-spacing: 0.16em; color: #B45309; width: 44px;">부사</span>
        <span style="font-size: 17px; font-weight: 500;">대략</span>
      </div>
    </div>

    <div style="margin-top: 22px; display: flex; flex-direction: column;">
      <div style="border-top: 1px solid #E7E1D8; padding: 14px 0; display: flex; flex-direction: column; gap: 4px;">
        <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 10px;">
          <span style="font-size: 15px; line-height: 1.5;">There&#39;s nothing to get angry <span style="border-bottom: 2px solid #B45309;">about</span>.</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8A8378" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 3px;"><path d="M4 9v6h4l5 4V5L8 9H4z"></path><path d="M16.5 8.5a5 5 0 0 1 0 7"></path></svg>
        </div>
        <span style="font-size: 12.5px; color: #8A8378;">화낼 일이 전혀 없다.</span>
      </div>
      <div style="border-top: 1px solid #E7E1D8; padding: 14px 0; display: flex; flex-direction: column; gap: 4px;">
        <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 10px;">
          <span style="font-size: 15px; line-height: 1.5;">Tell me <span style="border-bottom: 2px solid #B45309;">about</span> your day.</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8A8378" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 3px;"><path d="M4 9v6h4l5 4V5L8 9H4z"></path><path d="M16.5 8.5a5 5 0 0 1 0 7"></path></svg>
        </div>
        <span style="font-size: 12.5px; color: #8A8378;">네 하루에 대해 말해줘.</span>
      </div>
    </div>
  </div>

  <div style="display: flex; border-top: 1px solid #201D1A;">
    <button style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 16px 0 30px 0; background: none; border: none; border-right: 1px solid #E7E1D8; cursor: pointer; font-family: 'IBM Plex Sans KR', sans-serif;">
      <span style="width: 7px; height: 7px; border-radius: 50%; background: #B3261E;"></span>
      <span style="font-size: 14px; font-weight: 600; color: #201D1A;">모름</span>
    </button>
    <button style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 16px 0 30px 0; background: none; border: none; border-right: 1px solid #E7E1D8; cursor: pointer; font-family: 'IBM Plex Sans KR', sans-serif;">
      <span style="width: 7px; height: 7px; border-radius: 50%; background: #B45309;"></span>
      <span style="font-size: 14px; font-weight: 600; color: #201D1A;">헷갈림</span>
    </button>
    <button style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 16px 0 30px 0; background: none; border: none; cursor: pointer; font-family: 'IBM Plex Sans KR', sans-serif;">
      <span style="width: 7px; height: 7px; border-radius: 50%; background: #3F6212;"></span>
      <span style="font-size: 14px; font-weight: 600; color: #201D1A;">앎</span>
    </button>
  </div>
</div>
</x-dc>
</body>
</html>
