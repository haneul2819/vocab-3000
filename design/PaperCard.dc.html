<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&amp;family=Noto+Sans+KR:wght@400;500;700&amp;display=swap">
  <style>
    body { margin: 0; }
    a { color: #8B7CD8; } a:hover { color: #6F5FC4; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #F7F4EC; color: #4A443C; font-family: 'Gowun Dodum', 'Apple SD Gothic Neo', sans-serif; display: flex; flex-direction: column; box-sizing: border-box; overflow: hidden;">

  <div style="display: flex; justify-content: space-between; align-items: center; padding: 26px 22px 0 22px;">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#A29A8C" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg>
    <span style="font-size: 15px;">Day 1 카드</span>
    <span style="font-size: 13px; color: #A29A8C;">7 / 50</span>
  </div>

  <div style="display: flex; gap: 6px; padding: 14px 22px 0 22px;">
    <span style="background: #E4DEFB; color: #5F51B0; border-radius: 999px; padding: 6px 13px; font-size: 12px;">학습</span>
    <span style="background: #FFFFFF; color: #A29A8C; border-radius: 999px; padding: 6px 13px; font-size: 12px; box-shadow: 0 2px 8px rgba(90, 80, 60, 0.07);">셀프</span>
    <span style="background: #FFFFFF; color: #A29A8C; border-radius: 999px; padding: 6px 13px; font-size: 12px; box-shadow: 0 2px 8px rgba(90, 80, 60, 0.07);">오답 노트</span>
    <span style="background: #FFFFFF; color: #A29A8C; border-radius: 999px; padding: 6px 13px; font-size: 12px; box-shadow: 0 2px 8px rgba(90, 80, 60, 0.07);">듣기</span>
  </div>

  <div style="flex-grow: 1; position: relative; padding: 24px 22px 0 22px;">
    <div style="position: absolute; left: 34px; right: 34px; top: 34px; height: 100%; max-height: 560px; background: #FFFFFF; border-radius: 18px; transform: rotate(1.6deg); box-shadow: 0 8px 22px rgba(90, 80, 60, 0.08);"></div>

    <div style="position: relative; background: #FFFFFF; border-radius: 18px; box-shadow: 0 12px 30px rgba(90, 80, 60, 0.14); padding: 34px 22px 22px 22px; display: flex; flex-direction: column; gap: 16px;">
      <div style="position: absolute; top: -10px; left: 28px; width: 76px; height: 22px; background: rgba(213, 233, 250, 0.9); transform: rotate(-3deg); border-radius: 2px;"></div>

      <div style="display: flex; flex-direction: column; align-items: center; gap: 7px;">
        <div style="font-size: 48px; line-height: 1; letter-spacing: 0.01em;">about</div>
        <div style="display: flex; align-items: center; gap: 8px;">
          <span style="font-size: 14px; color: #A29A8C;">/əˈbaʊt/</span>
          <div style="width: 32px; height: 32px; background: #F1EDE2; border-radius: 999px; display: flex; align-items: center; justify-content: center;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8B7CD8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"></path><path d="M16.5 8.5a5 5 0 0 1 0 7"></path></svg>
          </div>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px;">
        <div style="display: flex; align-items: center; gap: 9px;">
          <span style="background: #E4DEFB; color: #5F51B0; border-radius: 7px; padding: 2px 9px; font-size: 11px;">전치사</span>
          <span style="font-size: 16px;">~에 대해, 약</span>
        </div>
        <div style="display: flex; align-items: center; gap: 9px;">
          <span style="background: #D9EEE4; color: #3E7A5E; border-radius: 7px; padding: 2px 9px; font-size: 11px;">부사</span>
          <span style="font-size: 16px;">대략</span>
        </div>
      </div>

      <div style="background-image: repeating-linear-gradient(#FFFFFF 0 27px, #EFEAE0 27px 28px); border-radius: 8px; display: flex; flex-direction: column; gap: 0; padding: 0 2px;">
        <div style="display: flex; flex-direction: column; padding: 3px 0 8px 0;">
          <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 8px;">
            <span style="font-size: 14.5px; line-height: 28px;">There&#39;s nothing to get angry <span style="border-bottom: 2px solid #F0B8A4;">about</span>.</span>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#B4AC9C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 7px;"><path d="M4 9v6h4l5 4V5L8 9H4z"></path><path d="M16.5 8.5a5 5 0 0 1 0 7"></path></svg>
          </div>
          <span style="font-size: 12px; color: #A29A8C; line-height: 28px;">화낼 일이 전혀 없다.</span>
        </div>
        <div style="display: flex; flex-direction: column; padding: 0 0 8px 0;">
          <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 8px;">
            <span style="font-size: 14.5px; line-height: 28px;">Tell me <span style="border-bottom: 2px solid #F0B8A4;">about</span> your day.</span>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#B4AC9C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 7px;"><path d="M4 9v6h4l5 4V5L8 9H4z"></path><path d="M16.5 8.5a5 5 0 0 1 0 7"></path></svg>
          </div>
          <span style="font-size: 12px; color: #A29A8C; line-height: 28px;">네 하루에 대해 말해줘.</span>
        </div>
      </div>
    </div>
  </div>

  <div style="display: flex; gap: 10px; padding: 14px 22px 30px 22px;">
    <button style="flex: 1; height: 54px; background: #F9DDD5; color: #B45740; border: none; border-radius: 999px; font-family: 'Gowun Dodum', sans-serif; font-size: 15px; cursor: pointer; box-shadow: 0 4px 10px rgba(90, 80, 60, 0.1);">모름</button>
    <button style="flex: 1; height: 54px; background: #FBF0D7; color: #9A7A2E; border: none; border-radius: 999px; font-family: 'Gowun Dodum', sans-serif; font-size: 15px; cursor: pointer; box-shadow: 0 4px 10px rgba(90, 80, 60, 0.1);">헷갈림</button>
    <button style="flex: 1; height: 54px; background: #D9EEE4; color: #3E7A5E; border: none; border-radius: 999px; font-family: 'Gowun Dodum', sans-serif; font-size: 15px; cursor: pointer; box-shadow: 0 4px 10px rgba(90, 80, 60, 0.1);">앎</button>
  </div>
</div>
</x-dc>
</body>
</html>
