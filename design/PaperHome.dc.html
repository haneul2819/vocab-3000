<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&amp;family=Noto+Sans+KR:wght@400;500;700&amp;display=swap">
  <style>
    body { margin: 0; }
    a { color: #8B7CD8; } a:hover { color: #6F5FC4; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #F7F4EC; color: #4A443C; font-family: 'Gowun Dodum', 'Apple SD Gothic Neo', sans-serif; display: flex; flex-direction: column; box-sizing: border-box; overflow: hidden;">

  <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 16px; padding: 28px 22px 0 22px; box-sizing: border-box;">

    <div style="display: flex; justify-content: space-between; align-items: center;">
      <div style="display: flex; flex-direction: column; gap: 2px;">
        <span style="font-size: 22px; letter-spacing: 0.02em;">나의 단어 공책</span>
        <span style="font-size: 12px; color: #A29A8C;">교육부 기본 어휘 3,000</span>
      </div>
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#A29A8C" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.2 2.2M16.9 16.9l2.2 2.2M19.1 4.9l-2.2 2.2M7.1 16.9l-2.2 2.2"></path></svg>
    </div>

    <div style="position: relative; background: #FFFFFF; border-radius: 16px; box-shadow: 0 10px 26px rgba(90, 80, 60, 0.12); padding: 26px 20px 20px 20px; display: flex; flex-direction: column; gap: 13px;">
      <div style="position: absolute; top: -9px; left: 50%; margin-left: -42px; width: 84px; height: 20px; background: rgba(228, 222, 251, 0.85); transform: rotate(-2deg); border-radius: 2px;"></div>
      <div style="display: flex; justify-content: space-between; align-items: baseline;">
        <span style="font-size: 26px;">Day 1 <span style="font-size: 14px; color: #A29A8C;">· 초등</span></span>
        <span style="font-size: 13px; color: #8B7CD8;">6/50 단어</span>
      </div>
      <div style="display: flex; gap: 7px;">
        <span style="width: 12px; height: 12px; border-radius: 50%; background: #8B7CD8;"></span>
        <span style="width: 12px; height: 12px; border-radius: 50%; background: #C9BFF0;"></span>
        <span style="width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid #DDD6C8; box-sizing: border-box;"></span>
        <span style="width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid #DDD6C8; box-sizing: border-box;"></span>
        <span style="width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid #DDD6C8; box-sizing: border-box;"></span>
        <span style="width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid #DDD6C8; box-sizing: border-box;"></span>
        <span style="width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid #DDD6C8; box-sizing: border-box;"></span>
        <span style="width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid #DDD6C8; box-sizing: border-box;"></span>
        <span style="width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid #DDD6C8; box-sizing: border-box;"></span>
        <span style="width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid #DDD6C8; box-sizing: border-box;"></span>
        <span style="font-size: 11px; color: #A29A8C; margin-left: 2px;">1칸 = 5단어</span>
      </div>
      <button style="height: 50px; background: #8B7CD8; color: #FFFFFF; border: none; border-radius: 999px; font-family: 'Gowun Dodum', sans-serif; font-size: 16px; cursor: pointer; box-shadow: 0 6px 14px rgba(139, 124, 216, 0.35);">오늘도 이어서 공부하기</button>
      <div style="display: flex; justify-content: center; gap: 6px; font-size: 13px;">
        <span style="color: #A29A8C;">복습할 카드</span>
        <span style="color: #E58F7B; border-bottom: 2px dashed #E58F7B; padding-bottom: 1px;">4장 기다리는 중</span>
      </div>
    </div>

    <div style="display: flex; gap: 10px;">
      <div style="flex: 1; background: #FBF0D7; border-radius: 14px; padding: 13px 14px; display: flex; flex-direction: column; gap: 2px; box-shadow: 0 4px 12px rgba(90, 80, 60, 0.08);">
        <span style="font-size: 14px;">진단 테스트</span>
        <span style="font-size: 11px; color: #A29A8C;">시작점 찾기</span>
      </div>
      <div style="flex: 1; background: #D9EEE4; border-radius: 14px; padding: 13px 14px; display: flex; flex-direction: column; gap: 2px; box-shadow: 0 4px 12px rgba(90, 80, 60, 0.08);">
        <span style="font-size: 14px;">연속 3일째</span>
        <span style="font-size: 11px; color: #A29A8C;">잘하고 있어요</span>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px;">
      <span style="font-size: 14px; color: #A29A8C;">트랙</span>

      <div style="background: #FFFFFF; border-radius: 14px; padding: 13px 16px; display: flex; align-items: center; gap: 12px; box-shadow: 0 4px 12px rgba(90, 80, 60, 0.08);">
        <span style="width: 10px; height: 34px; border-radius: 5px; background: #B7DFCB;"></span>
        <div style="display: flex; flex-direction: column; gap: 1px; flex-grow: 1;">
          <span style="font-size: 15px;">초등</span>
          <span style="font-size: 11.5px; color: #A29A8C;">Day 1–16 · 800단어</span>
        </div>
        <span style="font-size: 12px; color: #8B7CD8;">공부 중</span>
      </div>
      <div style="background: #FFFFFF; border-radius: 14px; padding: 13px 16px; display: flex; align-items: center; gap: 12px; box-shadow: 0 4px 12px rgba(90, 80, 60, 0.08);">
        <span style="width: 10px; height: 34px; border-radius: 5px; background: #C9BFF0;"></span>
        <div style="display: flex; flex-direction: column; gap: 1px; flex-grow: 1;">
          <span style="font-size: 15px;">중·고 공통</span>
          <span style="font-size: 11.5px; color: #A29A8C;">Day 17–40 · 1,200단어</span>
        </div>
      </div>
      <div style="background: #FFFFFF; border-radius: 14px; padding: 13px 16px; display: flex; align-items: center; gap: 12px; box-shadow: 0 4px 12px rgba(90, 80, 60, 0.08);">
        <span style="width: 10px; height: 34px; border-radius: 5px; background: #F5CDBF;"></span>
        <div style="display: flex; flex-direction: column; gap: 1px; flex-grow: 1;">
          <span style="font-size: 15px;">심화</span>
          <span style="font-size: 11.5px; color: #A29A8C;">Day 41–60 · 1,000단어</span>
        </div>
      </div>
    </div>
  </div>

  <div style="display: flex; background: rgba(255, 255, 255, 0.9); border-top: 1px solid #E8E2D4; padding: 10px 8px 24px 8px;">
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; color: #8B7CD8;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"></path><path d="M5 9.5V21h14V9.5"></path></svg>
      <span style="font-size: 10px;">홈</span>
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; color: #B4AC9C;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l4-1L20.5 6.5a2.1 2.1 0 0 0-3-3L5 16l-1 4z"></path></svg>
      <span style="font-size: 10px;">문제집</span>
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; color: #B4AC9C;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2 5c3-1.4 6-1.4 9 0v14c-3-1.4-6-1.4-9 0z"></path><path d="M22 5c-3-1.4-6-1.4-9 0v14c3-1.4 6-1.4 9 0z"></path></svg>
      <span style="font-size: 10px;">문법</span>
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; color: #B4AC9C;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.4"></path><path d="M21 3v6h-6"></path></svg>
      <span style="font-size: 10px;">복습</span>
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; color: #B4AC9C;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20v-8M10 20V5M16 20v-5M21 20H3"></path></svg>
      <span style="font-size: 10px;">통계</span>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
