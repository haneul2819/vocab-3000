<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&amp;family=Noto+Sans+KR:wght@400;500;700&amp;display=swap">
  <style>
    body { margin: 0; }
    a { color: #7C3AED; } a:hover { color: #6D28D9; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #FFF6E3; color: #33302E; font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif; display: flex; flex-direction: column; box-sizing: border-box; overflow: hidden;">

  <div style="display: flex; justify-content: space-between; align-items: center; padding: 22px 20px 0 20px;">
    <div style="width: 38px; height: 38px; background: #FFFFFF; border: 2px solid #33302E; border-radius: 12px; box-shadow: 0 3px 0 #33302E; display: flex; align-items: center; justify-content: center;">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#33302E" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg>
    </div>
    <div style="flex-grow: 1; margin: 0 14px; height: 16px; background: #F1EADF; border: 2px solid #33302E; border-radius: 999px; overflow: hidden;">
      <div style="width: 14%; height: 100%; background: repeating-linear-gradient(-55deg, #2EC4B6 0 10px, #3AD6C8 10px 20px); border-right: 2px solid #33302E;"></div>
    </div>
    <span style="font-family: 'Jua', sans-serif; font-size: 15px;">7/50</span>
  </div>

  <div style="display: flex; gap: 6px; padding: 14px 20px 0 20px;">
    <span style="background: #7C3AED; color: #FFFFFF; border: 2px solid #33302E; border-radius: 999px; padding: 6px 13px; font-size: 12px; font-weight: 700;">학습</span>
    <span style="background: #FFFFFF; border: 2px solid #33302E; border-radius: 999px; padding: 6px 13px; font-size: 12px; font-weight: 500;">셀프</span>
    <span style="background: #FFFFFF; border: 2px solid #33302E; border-radius: 999px; padding: 6px 13px; font-size: 12px; font-weight: 500;">오답 노트</span>
    <span style="background: #FFFFFF; border: 2px solid #33302E; border-radius: 999px; padding: 6px 13px; font-size: 12px; font-weight: 500;">듣기</span>
  </div>

  <div style="flex-grow: 1; padding: 18px 20px 0 20px;">
    <div style="background: #FFFFFF; border: 3px solid #33302E; border-radius: 26px; box-shadow: 0 6px 0 #33302E; padding: 26px 20px; display: flex; flex-direction: column; align-items: center; gap: 14px;">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 6px;">
        <div style="font-family: 'Jua', sans-serif; font-size: 52px; line-height: 1;">about</div>
        <div style="display: flex; align-items: center; gap: 8px;">
          <span style="font-size: 14px; color: #8B8578;">/əˈbaʊt/</span>
          <div style="width: 32px; height: 32px; background: #FFC800; border: 2px solid #33302E; border-radius: 999px; box-shadow: 0 2.5px 0 #33302E; display: flex; align-items: center; justify-content: center;">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#33302E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"></path><path d="M16.5 8.5a5 5 0 0 1 0 7"></path></svg>
          </div>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px; width: 100%;">
        <div style="display: flex; align-items: center; gap: 8px;">
          <span style="background: #E9D8FF; border: 2px solid #33302E; border-radius: 8px; padding: 2px 8px; font-size: 11px; font-weight: 700;">전치사</span>
          <span style="font-size: 16px; font-weight: 700;">~에 대해, 약</span>
        </div>
        <div style="display: flex; align-items: center; gap: 8px;">
          <span style="background: #D7F5E9; border: 2px solid #33302E; border-radius: 8px; padding: 2px 8px; font-size: 11px; font-weight: 700;">부사</span>
          <span style="font-size: 16px; font-weight: 700;">대략</span>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px; width: 100%;">
        <div style="background: #FFF6E3; border: 2px dashed #C9BFA8; border-radius: 14px; padding: 10px 12px; display: flex; flex-direction: column; gap: 3px;">
          <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 8px;">
            <span style="font-size: 14px; line-height: 1.45;">There&#39;s nothing to get angry <b style="color: #7C3AED;">about</b>.</span>
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#8B8578" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 2px;"><path d="M4 9v6h4l5 4V5L8 9H4z"></path><path d="M16.5 8.5a5 5 0 0 1 0 7"></path></svg>
          </div>
          <span style="font-size: 12px; color: #8B8578;">화낼 일이 전혀 없다.</span>
        </div>
        <div style="background: #FFF6E3; border: 2px dashed #C9BFA8; border-radius: 14px; padding: 10px 12px; display: flex; flex-direction: column; gap: 3px;">
          <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 8px;">
            <span style="font-size: 14px; line-height: 1.45;">Tell me <b style="color: #7C3AED;">about</b> your day.</span>
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#8B8578" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 2px;"><path d="M4 9v6h4l5 4V5L8 9H4z"></path><path d="M16.5 8.5a5 5 0 0 1 0 7"></path></svg>
          </div>
          <span style="font-size: 12px; color: #8B8578;">네 하루에 대해 말해줘.</span>
        </div>
      </div>
    </div>
  </div>

  <div style="display: flex; gap: 10px; padding: 12px 20px 28px 20px;">
    <button style="flex: 1; height: 56px; background: #FF6B6B; color: #FFFFFF; border: 2.5px solid #33302E; border-radius: 16px; box-shadow: 0 5px 0 #33302E; font-family: 'Jua', sans-serif; font-size: 17px; cursor: pointer;">모름</button>
    <button style="flex: 1; height: 56px; background: #FFC800; color: #33302E; border: 2.5px solid #33302E; border-radius: 16px; box-shadow: 0 5px 0 #33302E; font-family: 'Jua', sans-serif; font-size: 17px; cursor: pointer;">헷갈림</button>
    <button style="flex: 1; height: 56px; background: #2EC4B6; color: #FFFFFF; border: 2.5px solid #33302E; border-radius: 16px; box-shadow: 0 5px 0 #33302E; font-family: 'Jua', sans-serif; font-size: 17px; cursor: pointer;">앎!</button>
  </div>
</div>
</x-dc>
</body>
</html>
