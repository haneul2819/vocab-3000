<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&amp;family=Noto+Sans+KR:wght@400;500;700&amp;display=swap">
  <style>
    body { margin: 0; }
    a { color: #7C3AED; } a:hover { color: #6D28D9; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #FFF6E3; color: #33302E; font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif; display: flex; flex-direction: column; box-sizing: border-box; overflow: hidden;">

  <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 14px; padding: 26px 20px 0 20px; box-sizing: border-box;">

    <div style="display: flex; justify-content: space-between; align-items: center;">
      <div style="font-family: 'Jua', sans-serif; font-size: 26px;">어휘 3000</div>
      <div style="display: flex; gap: 8px;">
        <div style="display: flex; align-items: center; gap: 5px; background: #FFFFFF; border: 2px solid #33302E; border-radius: 999px; padding: 5px 12px; box-shadow: 0 3px 0 #33302E;">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="#FF7A1A" stroke="none"><path d="M12 2c1.5 3.5-1 5-1 7.5a2.6 2.6 0 0 0 5.1.6C18.2 11.6 20 13.6 20 16a8 8 0 1 1-16 0c0-2.7 1.6-4.6 3.5-6.5.2 1.6.9 2.7 2 3.1C9 9.5 10.4 5.4 12 2z"></path></svg>
          <span style="font-size: 13px; font-weight: 700;">3일</span>
        </div>
        <div style="display: flex; align-items: center; gap: 5px; background: #FFFFFF; border: 2px solid #33302E; border-radius: 999px; padding: 5px 12px; box-shadow: 0 3px 0 #33302E;">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="#FFC800" stroke="#33302E" stroke-width="1.4" stroke-linejoin="round"><path d="M12 3l2.7 5.6 6.1.8-4.5 4.2 1.1 6L12 16.8 6.6 19.6l1.1-6L3.2 9.4l6.1-.8z"></path></svg>
          <span style="font-size: 13px; font-weight: 700;">120</span>
        </div>
      </div>
    </div>

    <div style="background: #FFFFFF; border: 2.5px solid #33302E; border-radius: 22px; box-shadow: 0 5px 0 #33302E; padding: 18px 18px 20px 18px; display: flex; flex-direction: column; gap: 12px;">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <div style="display: flex; align-items: center; gap: 8px;">
          <span style="background: #E9D8FF; border: 2px solid #33302E; border-radius: 999px; padding: 3px 10px; font-size: 11.5px; font-weight: 700;">초등</span>
          <span style="font-family: 'Jua', sans-serif; font-size: 24px;">Day 1</span>
        </div>
        <span style="font-size: 13px; font-weight: 700; color: #7C3AED;">6/50</span>
      </div>
      <div style="height: 16px; background: #F1EADF; border: 2px solid #33302E; border-radius: 999px; overflow: hidden;">
        <div style="width: 14%; height: 100%; background: repeating-linear-gradient(-55deg, #2EC4B6 0 10px, #3AD6C8 10px 20px); border-right: 2px solid #33302E;"></div>
      </div>
      <button style="height: 54px; background: #7C3AED; color: #FFFFFF; border: 2.5px solid #33302E; border-radius: 16px; box-shadow: 0 5px 0 #33302E; font-family: 'Jua', sans-serif; font-size: 18px; cursor: pointer;">학습 시작!</button>
      <button style="height: 44px; background: #FFF6E3; color: #33302E; border: 2px solid #33302E; border-radius: 14px; box-shadow: 0 3px 0 #33302E; font-family: 'Noto Sans KR', sans-serif; font-size: 14px; font-weight: 700; cursor: pointer;">오늘 복습 4개 해치우기</button>
    </div>

    <div style="background: #FFE9A8; border: 2.5px solid #33302E; border-radius: 18px; box-shadow: 0 4px 0 #33302E; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center;">
      <div style="display: flex; flex-direction: column; gap: 1px;">
        <span style="font-family: 'Jua', sans-serif; font-size: 16px;">진단 테스트</span>
        <span style="font-size: 12px; font-weight: 500;">내 실력에 딱 맞는 Day 찾기</span>
      </div>
      <div style="width: 36px; height: 36px; background: #FFFFFF; border: 2px solid #33302E; border-radius: 12px; box-shadow: 0 3px 0 #33302E; display: flex; align-items: center; justify-content: center;">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#33302E" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px;">
      <div style="font-family: 'Jua', sans-serif; font-size: 16px;">트랙 고르기</div>

      <div style="background: #FFFFFF; border: 2.5px solid #33302E; border-radius: 18px; box-shadow: 0 4px 0 #33302E; padding: 12px 16px; display: flex; align-items: center; gap: 12px;">
        <div style="width: 42px; height: 42px; background: #D7F5E9; border: 2px solid #33302E; border-radius: 14px; display: flex; align-items: center; justify-content: center;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#12876F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19c4-2 6-6 6-11l4 2c0 5 2 8 6 9"></path><circle cx="10" cy="5" r="2"></circle></svg>
        </div>
        <div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1;">
          <span style="font-size: 14.5px; font-weight: 700;">초등</span>
          <span style="font-size: 11.5px; color: #8B8578;">Day 1–16 · 800단어</span>
        </div>
        <span style="background: #2EC4B6; color: #FFFFFF; border: 2px solid #33302E; border-radius: 999px; padding: 3px 10px; font-size: 11px; font-weight: 700;">진행중</span>
      </div>

      <div style="background: #FFFFFF; border: 2.5px solid #33302E; border-radius: 18px; box-shadow: 0 4px 0 #33302E; padding: 12px 16px; display: flex; align-items: center; gap: 12px;">
        <div style="width: 42px; height: 42px; background: #E9D8FF; border: 2px solid #33302E; border-radius: 14px; display: flex; align-items: center; justify-content: center;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#7C3AED" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9 5-9 5-9-5z"></path><path d="M6 10.5V16c0 1.5 2.7 3 6 3s6-1.5 6-3v-5.5"></path></svg>
        </div>
        <div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1;">
          <span style="font-size: 14.5px; font-weight: 700;">중·고 공통</span>
          <span style="font-size: 11.5px; color: #8B8578;">Day 17–40 · 1,200단어</span>
        </div>
      </div>

      <div style="background: #FFFFFF; border: 2.5px solid #33302E; border-radius: 18px; box-shadow: 0 4px 0 #33302E; padding: 12px 16px; display: flex; align-items: center; gap: 12px;">
        <div style="width: 42px; height: 42px; background: #FFD9C9; border: 2px solid #33302E; border-radius: 14px; display: flex; align-items: center; justify-content: center;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#E14D2A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 21V4l6 3 6-3v17"></path><path d="M6 13l6 3 6-3"></path></svg>
        </div>
        <div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1;">
          <span style="font-size: 14.5px; font-weight: 700;">심화</span>
          <span style="font-size: 11.5px; color: #8B8578;">Day 41–60 · 1,000단어</span>
        </div>
      </div>
    </div>
  </div>

  <div style="display: flex; gap: 4px; background: #FFFFFF; border-top: 2.5px solid #33302E; padding: 10px 10px 24px 10px;">
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; background: #FFC800; border: 2px solid #33302E; border-radius: 14px; padding: 7px 0;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#33302E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"></path><path d="M5 9.5V21h14V9.5"></path></svg>
      <span style="font-size: 10px; font-weight: 700;">홈</span>
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 9px 0; color: #8B8578;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l4-1L20.5 6.5a2.1 2.1 0 0 0-3-3L5 16l-1 4z"></path></svg>
      <span style="font-size: 10px; font-weight: 500;">문제집</span>
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 9px 0; color: #8B8578;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 5c3-1.4 6-1.4 9 0v14c-3-1.4-6-1.4-9 0z"></path><path d="M22 5c-3-1.4-6-1.4-9 0v14c3-1.4 6-1.4 9 0z"></path></svg>
      <span style="font-size: 10px; font-weight: 500;">문법</span>
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 9px 0; color: #8B8578;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.4"></path><path d="M21 3v6h-6"></path></svg>
      <span style="font-size: 10px; font-weight: 500;">복습</span>
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 9px 0; color: #8B8578;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20v-8M10 20V5M16 20v-5M21 20H3"></path></svg>
      <span style="font-size: 10px; font-weight: 500;">통계</span>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
